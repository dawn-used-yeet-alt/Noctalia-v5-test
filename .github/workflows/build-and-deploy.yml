name: Build Noctalia Shell

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-pkg:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Update System & Install Build Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo curl gnupg

      - name: Set up Non-Root Build User
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Cache pacman packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ runner.os }}-${{ hashFiles('.github/workflows/build-and-deploy.yml') }}
          restore-keys: |
            pacman-${{ runner.os }}-

      - name: Import GPG signing key
        if: ${{ env.GPG_PRIVATE_KEY != '' }}
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          # Extract the full fingerprint (reliable across GPG versions)
          GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '/^fpr:/ {print $10; exit}')
          GPG_KEY_ID=$(echo "$GPG_FINGERPRINT" | tail -c 17)
          # Trust the imported key ultimately
          echo "${GPG_FINGERPRINT}:6:" | gpg --import-ownertrust
          # Export the key ID for later steps
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          echo "GPG_FINGERPRINT=$GPG_FINGERPRINT" >> "$GITHUB_ENV"
          # Export public key so users can verify packages
          gpg --armor --export "$GPG_FINGERPRINT" > /tmp/noctalia-signing-key.gpg
          echo "GPG signing key imported: $GPG_KEY_ID (fingerprint: $GPG_FINGERPRINT)"

      - name: Check for updates and compile if needed
        id: build
        timeout-minutes: 30
        env:
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
          GPG_FINGERPRINT: ${{ env.GPG_FINGERPRINT }}
        run: |
          mkdir -p /tmp/artifact
          chmod +x scripts/build.sh
          chown -R builder:builder /home/builder
          chown -R builder:builder /tmp/artifact

          # If GPG key is set up, share it with the builder user
          if [ -n "$GPG_FINGERPRINT" ]; then
            # Export and import GPG key for builder user
            gpg --armor --export-secret-keys "$GPG_FINGERPRINT" | sudo -u builder gpg --batch --import
            echo "${GPG_FINGERPRINT}:6:" | sudo -u builder gpg --import-ownertrust
          fi

          sudo --preserve-env -u builder bash scripts/build.sh

      - name: Create Pacman Repository and Index Page
        timeout-minutes: 5
        env:
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
        run: |
          cd /tmp/artifact

          if [ -f "build_status" ]; then
              echo "Build was skipped, using existing artifacts."
              rm build_status
          else
              # Sign and create pacman repository database
              if [ -n "${GPG_KEY_ID:-}" ]; then
                  echo "Signing packages and repo with GPG key $GPG_KEY_ID"
                  # Sign each package
                  for pkg in *.pkg.tar.zst; do
                      gpg --batch --yes --detach-sign --use-agent "$pkg"
                  done
                  repo-add --sign noctalia.db.tar.gz *.pkg.tar.zst
              else
                  echo "WARNING: No GPG key configured — packages will NOT be signed."
                  echo "Set the GPG_PRIVATE_KEY secret to enable signing."
                  repo-add noctalia.db.tar.gz *.pkg.tar.zst
              fi

              # GitHub Pages cannot follow symlinks, so replace them with copies
              rm -f noctalia.db noctalia.files noctalia.db.sig noctalia.files.sig
              cp --remove-destination noctalia.db.tar.gz noctalia.db
              cp --remove-destination noctalia.files.tar.gz noctalia.files

              # Copy signature files too if they exist
              [ -f noctalia.db.tar.gz.sig ] && cp --remove-destination noctalia.db.tar.gz.sig noctalia.db.sig
              [ -f noctalia.files.tar.gz.sig ] && cp --remove-destination noctalia.files.tar.gz.sig noctalia.files.sig

              # Copy the public key for distribution
              [ -f /tmp/noctalia-signing-key.gpg ] && cp /tmp/noctalia-signing-key.gpg .

              # Read the upstream commit written by build.sh
              COMMIT="unknown"
              if [ -f "LATEST_COMMIT" ]; then
                  COMMIT=$(cat LATEST_COMMIT)
                  rm LATEST_COMMIT
              fi

              # Determine package version
              PKG_FILE=$(ls *.pkg.tar.zst | head -n 1)
              VERSION=$(pacman -Qip "$PKG_FILE" | grep Version | awk '{print $3}')

              REPO_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

              # Determine SigLevel and setup instructions based on whether signing is configured
              if [ -n "${GPG_KEY_ID:-}" ]; then
                  SIGLEVEL="Required DatabaseOptional"
                  SETUP_INSTRUCTIONS=$(cat <<'INNER'
          <h2>Setup</h2>
          <p>1. Import the signing key:</p>
          <pre>curl -fsSL ${REPO_URL}/noctalia-signing-key.gpg | sudo pacman-key --add -
          sudo pacman-key --lsign-key ${GPG_KEY_ID}</pre>
          <p>2. Add to /etc/pacman.conf:</p>
          <pre>
          [noctalia]
          SigLevel = Required DatabaseOptional
          Server = ${REPO_URL}
          </pre>
          <p>3. Install:</p>
          <pre>sudo pacman -Sy noctalia-git</pre>
          INNER
          )
                  # Expand variables in the setup instructions
                  SETUP_INSTRUCTIONS=$(echo "$SETUP_INSTRUCTIONS" | sed "s|\${REPO_URL}|${REPO_URL}|g; s|\${GPG_KEY_ID}|${GPG_KEY_ID}|g")
              else
                  SIGLEVEL="Optional TrustAll"
                  SETUP_INSTRUCTIONS=$(cat <<INNER
          <h2>Setup</h2>
          <p>Add to /etc/pacman.conf:</p>
          <pre>
          [noctalia]
          SigLevel = Optional TrustAll
          Server = ${REPO_URL}
          </pre>
          <p>Then run: <code>sudo pacman -Sy noctalia-git</code></p>
          INNER
          )
              fi

              # Write a plain-text COMMIT file for the next run's cache check
              echo "$COMMIT" > COMMIT

              # Generate index page
              cat <<EOF > index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Noctalia Repository</title>
          </head>
          <body>
          <h1>Noctalia Repository</h1>
          <p>Version: ${VERSION}</p>
          <p>Commit: ${COMMIT}</p>
          ${SETUP_INSTRUCTIONS}
          </body>
          </html>
          EOF

              # Generate checksums for integrity verification
              sha256sum *.pkg.tar.zst noctalia.db noctalia.db.tar.gz \
                        noctalia.files noctalia.files.tar.gz > SHA256SUMS
          fi

      - name: Upload Package Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: noctalia-arch-package
          path: /tmp/artifact/*
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-pkg
    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: noctalia-arch-package
          path: './pages-artifact'

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: './pages-artifact'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
