name: Build & Deploy Noctalia

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-pkg:
    runs-on: ubuntu-latest
    container:
      image: archlinux@sha256:a674898d53cc63b1af4023a468ccddc25ed9d7aecc3996f16171838a57085999  # archlinux:latest 2026-08-07

    steps:
      - name: Update System & Install Build Dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo curl gnupg

      - name: Set up Non-Root Build User
        run: |
          useradd -m builder
          # Restrict builder to only the pacman binary — it does not need full root.
          # Write to a drop-in file so syntax errors don't silently break the base sudoers.
          cat > /etc/sudoers.d/builder <<'SUDOERS'
          builder ALL=(ALL) NOPASSWD: /usr/bin/pacman
          Defaults:builder env_keep += "GITHUB_REPOSITORY GITHUB_REPOSITORY_OWNER"
          SUDOERS
          chmod 440 /etc/sudoers.d/builder

      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Cache pacman packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ runner.os }}-${{ hashFiles('.github/workflows/build-and-deploy.yml') }}
          restore-keys: |
            pacman-${{ runner.os }}-

      - name: Check GPG key availability
        id: gpg-check
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Import GPG signing key
        if: steps.gpg-check.outputs.available == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          # Write key to a secure temp file to avoid special-character issues with echo pipes
          _gpg_tmp=$(mktemp)
          chmod 600 "$_gpg_tmp"
          printf '%s' "$GPG_PRIVATE_KEY" > "$_gpg_tmp"
          gpg --batch --import "$_gpg_tmp"
          rm -f "$_gpg_tmp"
          # Extract the full fingerprint (reliable across GPG versions)
          GPG_FINGERPRINT=$(gpg --list-secret-keys --with-colons 2>/dev/null | awk -F: '/^fpr:/ {print $10; exit}')
          GPG_KEY_ID="${GPG_FINGERPRINT: -16}"
          # Trust the imported key ultimately
          echo "${GPG_FINGERPRINT}:6:" | gpg --import-ownertrust
          # Export the key ID for later steps
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"
          echo "GPG_FINGERPRINT=$GPG_FINGERPRINT" >> "$GITHUB_ENV"
          # Export public key so users can verify packages
          gpg --armor --export "$GPG_FINGERPRINT" > /tmp/noctalia-signing-key.gpg
          echo "GPG signing key imported: $GPG_KEY_ID (fingerprint: $GPG_FINGERPRINT)"

      - name: Check for updates and compile if needed
        id: build
        timeout-minutes: 25
        env:
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
          GPG_FINGERPRINT: ${{ env.GPG_FINGERPRINT }}
          # Explicitly forward these so they are available inside the sudo subprocess
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p /tmp/artifact
          chmod +x scripts/build.sh
          chown -R builder:builder /home/builder
          chown -R builder:builder /tmp/artifact

          # If GPG key is set up, share it with the builder user
          if [ -n "$GPG_FINGERPRINT" ]; then
            # Export the secret key to a secure temp file before importing into builder's keyring
            _builder_gpg_tmp=$(mktemp)
            chmod 600 "$_builder_gpg_tmp"
            gpg --armor --export-secret-keys "$GPG_FINGERPRINT" > "$_builder_gpg_tmp"
            sudo -u builder gpg --batch --import "$_builder_gpg_tmp"
            rm -f "$_builder_gpg_tmp"
            echo "${GPG_FINGERPRINT}:6:" | sudo -u builder gpg --import-ownertrust
          fi

          sudo --preserve-env -u builder bash scripts/build.sh

      - name: Create Pacman Repository and Index Page
        timeout-minutes: 5
        env:
          GPG_KEY_ID: ${{ env.GPG_KEY_ID }}
        run: |
          cd /tmp/artifact

          if [ -f "build_status" ]; then
              echo "Build was skipped, using existing artifacts."
              rm build_status
          else
              # Sign and create pacman repository database
              # Verify packages exist before proceeding
              shopt -s nullglob
              pkgs=(*.pkg.tar.zst)
              shopt -u nullglob
              if [ ${#pkgs[@]} -eq 0 ]; then
                  echo "ERROR: No packages found to add to repository"
                  exit 1
              fi

              if [ -n "${GPG_KEY_ID:-}" ]; then
                  echo "Signing packages and repo with GPG key $GPG_KEY_ID"
                  # Sign each package
                  for pkg in "${pkgs[@]}"; do
                      gpg --batch --yes --pinentry-mode loopback --detach-sign -u "$GPG_KEY_ID" "$pkg"
                      gpg --verify "$pkg.sig" "$pkg"
                  done
                  repo-add --sign --key "$GPG_KEY_ID" noctalia.db.tar.gz "${pkgs[@]}"
              else
                  echo "WARNING: No GPG key configured — packages will NOT be signed."
                  echo "Set the GPG_PRIVATE_KEY secret to enable signing."
                  repo-add noctalia.db.tar.gz "${pkgs[@]}"
              fi

              # GitHub Pages cannot follow symlinks, so replace them with copies
              rm -f noctalia.db noctalia.files noctalia.db.sig noctalia.files.sig
              cp --remove-destination noctalia.db.tar.gz noctalia.db
              cp --remove-destination noctalia.files.tar.gz noctalia.files

              # Copy signature files too if they exist
              [ -f noctalia.db.tar.gz.sig ] && cp --remove-destination noctalia.db.tar.gz.sig noctalia.db.sig
              [ -f noctalia.files.tar.gz.sig ] && cp --remove-destination noctalia.files.tar.gz.sig noctalia.files.sig

              # Copy the public key for distribution
              [ -f /tmp/noctalia-signing-key.gpg ] && cp /tmp/noctalia-signing-key.gpg .

              # Read the upstream commit written by build.sh
              COMMIT="unknown"
              if [ -f "LATEST_COMMIT" ]; then
                  COMMIT=$(cat LATEST_COMMIT)
                  rm LATEST_COMMIT
              fi

              # Determine package version
              PKG_FILE="${pkgs[0]}"
              # Use bsdtar + .PKGINFO for reliable version extraction on uninstalled packages
              VERSION=$(bsdtar -xOf "$PKG_FILE" .PKGINFO | awk -F' = ' '/^pkgver/{print $2; exit}')
              REPO_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"

              # Write a plain-text COMMIT file for the next run's cache check
              echo "$COMMIT" > COMMIT

              # Generate index page using helper script
              chmod +x "$GITHUB_WORKSPACE/scripts/generate_index.sh"
              "$GITHUB_WORKSPACE/scripts/generate_index.sh" /tmp/artifact "$VERSION" "$COMMIT" "${GPG_KEY_ID:-}" "$REPO_URL"

              # Generate checksums for integrity verification across all repository files
              # Do NOT suppress errors — a failure here would cause a confusing mismatch on the next run.
              sha256sum ./*.pkg.tar.zst* ./noctalia.db* ./noctalia.files* > SHA256SUMS
          fi

      - name: Upload Package Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: noctalia-arch-package
          path: /tmp/artifact/*
          retention-days: 1

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-pkg
    steps:
      - name: Download artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: noctalia-arch-package
          path: './pages-artifact'

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: './pages-artifact'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
